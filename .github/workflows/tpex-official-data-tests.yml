name: TPEx Official Volume Tests

on:
  push:
    branches:
      - king/tw-official-market-data-20261118
  pull_request:
    paths:
      - "data_provider/tw_official_market_data.py"
      - "tests/test_tw_official_market_data.py"
      - ".github/workflows/tpex-official-data-tests.yml"

permissions:
  contents: read

concurrency:
  group: tpex-official-volume-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check pandas requests
      - name: Run official volume tests
        run: python -m unittest discover -s tests -p "test_tw_official_market_data.py" -v
