name: Fugle Taiwan intraday email snapshot

on:
  schedule:
    # GitHub cron uses UTC; Taiwan is UTC+8.
    - cron: '30 2 * * 1-5'  # 10:30 Taipei
    - cron: '30 4 * * 1-5'  # 12:30 Taipei
    - cron: '0 7 * * 1-5'   # 15:00 Taipei
  workflow_dispatch:

concurrency:
  group: fugle-intraday-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # Keep the existing environment so its Gmail/Fugle secrets remain available.
    environment: STOCK_LIST
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch nine Fugle quotes and email snapshot
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER || secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || secrets.EMAIL_RECEIVERS }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME || secrets.EMAIL_SENDER_NAME || '台股儀表板' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Dedicated name avoids the legacy STOCK_LIST environment override.
          STOCK_LIST: ${{ vars.TW_STOCK_LIST || secrets.TW_STOCK_LIST || '1303.TW,2408.TW,2603.TW,2409.TW,2344.TW,2454.TW,3231.TW,2330.TW,2881.TW' }}
        run: python scripts/fugle_intraday_email.py

      - name: Email workflow failure notice
        if: failure()
        env:
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER || secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || secrets.EMAIL_RECEIVERS }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME || secrets.EMAIL_SENDER_NAME || '台股儀表板' }}
          FAILURE_WORKFLOW: ${{ github.workflow }}
          FAILURE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILURE_RUN_ID: ${{ github.run_id }}
          FAILURE_RUN_NUMBER: ${{ github.run_number }}
        run: python scripts/send_workflow_failure_notice.py
