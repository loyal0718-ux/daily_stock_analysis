name: Fugle Taiwan intraday email snapshot

on:
  # Automatic intraday quote notifications are intentionally disabled.
  # Manual dispatch remains available for maintenance/testing.
  workflow_dispatch:

concurrency:
  group: fugle-intraday-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # Keep the existing environment so its Gmail/Fugle secrets remain available.
    environment: STOCK_LIST
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch configured Fugle quotes and email snapshot
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER || secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || secrets.EMAIL_RECEIVERS }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME || secrets.EMAIL_SENDER_NAME || '台股儀表板' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          export STOCK_LIST="$(python scripts/load_tw_watchlist.py)"
          if [ -z "$STOCK_LIST" ]; then
            echo "::error::Taiwan watchlist is empty; refusing to send snapshot"
            exit 1
          fi
          python scripts/fugle_intraday_email.py

      - name: Email workflow failure notice
        if: failure()
        env:
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER || secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || secrets.EMAIL_RECEIVERS }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME || secrets.EMAIL_SENDER_NAME || '台股儀表板' }}
          FAILURE_WORKFLOW: ${{ github.workflow }}
          FAILURE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILURE_RUN_ID: ${{ github.run_id }}
          FAILURE_RUN_NUMBER: ${{ github.run_number }}
        run: python scripts/send_workflow_failure_notice.py
