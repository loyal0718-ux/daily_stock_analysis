name: 南亞短線價位監控

on:
  # GitHub cron uses UTC. Taiwan market 09:00-13:30 = UTC 01:00-05:30.
  # 10-minute polling is best-effort; GitHub scheduled starts are not guaranteed exact.
  schedule:
    - cron: '*/10 1-4 * * 1-5'
    - cron: '0,10,20,30 5 * * 1-5'
  workflow_dispatch:

concurrency:
  group: south-asia-1303-intraday
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment: STOCK_LIST
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore today's alert markers
        uses: actions/cache/restore@v4
        with:
          path: .cache/southasia
          key: southasia-1303-${{ github.run_id }}
          restore-keys: |
            southasia-1303-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Monitor 南亞 and send event alerts
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STOCK_LIST: '1303.TW'
        run: python scripts/southasia_short_term_monitor.py

      - name: Save today's alert markers
        if: always() && hashFiles('.cache/southasia/*.sent') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/southasia
          key: southasia-1303-${{ github.run_id }}
